<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowR" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="pyr"><polygon points="140,262 372,262 432,432 80,432"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#030504"/>
  <!-- faint rays behind the capstone -->
  <g stroke="#00FF66" stroke-opacity="0.10" stroke-width="6">
    <line x1="256" y1="165" x2="256" y2="20"/><line x1="256" y1="165" x2="120" y2="40"/><line x1="256" y1="165" x2="392" y2="40"/>
    <line x1="256" y1="165" x2="40" y2="130"/><line x1="256" y1="165" x2="472" y2="130"/>
  </g>
  <!-- pyramid body with brick courses -->
  <g clip-path="url(#pyr)" stroke="#00FF66" stroke-opacity="0.30" stroke-width="5">
    <line x1="0" y1="304" x2="512" y2="304"/><line x1="0" y1="346" x2="512" y2="346"/><line x1="0" y1="390" x2="512" y2="390"/>
    <line x1="210" y1="262" x2="210" y2="304"/><line x1="300" y1="262" x2="300" y2="304"/>
    <line x1="165" y1="304" x2="165" y2="346"/><line x1="256" y1="304" x2="256" y2="346"/><line x1="347" y1="304" x2="347" y2="346"/>
    <line x1="120" y1="346" x2="120" y2="390"/><line x1="210" y1="346" x2="210" y2="390"/><line x1="300" y1="346" x2="300" y2="390"/><line x1="390" y1="346" x2="390" y2="390"/>
    <line x1="165" y1="390" x2="165" y2="432"/><line x1="256" y1="390" x2="256" y2="432"/><line x1="347" y1="390" x2="347" y2="432"/>
  </g>
  <polygon points="140,262 372,262 432,432 80,432" fill="none" stroke="#00FF66" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- floating capstone with the eye -->
  <polygon points="256,70 360,236 152,236" fill="#030504" stroke="#00FF66" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <path d="M196 190 C222 160 290 160 316 190 C290 220 222 220 196 190 Z" fill="none" stroke="#00FF66" stroke-width="10"/>
    <circle cx="256" cy="190" r="17" fill="#00FF66"/>
  </g>
  <!-- the blinding slash -->
  <line x1="182" y1="246" x2="330" y2="128" stroke="#FF2E63" stroke-width="18" stroke-linecap="round" filter="url(#glowR)"/>
</svg>
