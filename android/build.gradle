plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.bitcoinismoral.linkcleaner'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.bitcoinismoral.linkcleaner'
        minSdk 29
        targetSdk 34
        // keep in sync with VERSION_CODE / VERSION_NAME in buildtools/ResEncoder.java (CI checks this)
        versionCode 10
        versionName '3.5.1'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'   // generated from buildtools/ResEncoder.java
            java.srcDirs = ['../app']
            res.srcDirs = ['../res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // No Google-encrypted dependency blob in the APK (F-Droid requirement for reproducible builds)
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        abortOnError false
    }
}

// Pure-Java app with zero dependencies: keep the Kotlin runtime AGP 9 adds by default out of the
// APK. Only the app's packaged classpaths are filtered; build tools such as lint keep theirs.
configurations.matching { it.name ==~ /(release|debug)RuntimeClasspath/ }.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
