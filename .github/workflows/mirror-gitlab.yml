name: mirror to GitLab

# Copies the code, tags and each GitHub release (with its APK) to GitLab, so Obtainium can also
# install/update from https://gitlab.com/<GITLAB_PROJECT>.
#
# Dormant until configured (Settings -> Secrets and variables -> Actions):
#   variable  GITLAB_PROJECT  e.g. bitcoinismoral/SurveillanceSlopRemover
#   secret    GITLAB_TOKEN    GitLab project access token, role Maintainer, scopes: api, write_repository
#
# Runs on every published GitHub release; run it manually (Actions -> mirror to GitLab -> Run
# workflow) to mirror an existing release, e.g. v3.6.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror (e.g. v3.6)
        required: true

permissions:
  contents: read

jobs:
  mirror:
    if: ${{ vars.GITLAB_PROJECT != '' }}
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      API: https://gitlab.com/api/v4
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push code and tags to GitLab
        run: |
          remote="https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git"
          git push "$remote" refs/remotes/origin/main:refs/heads/main
          git push "$remote" --tags

      - name: Download the release APK from GitHub
        run: |
          mkdir dist
          gh release download "$TAG" --pattern '*.apk' --dir dist
          gh release view "$TAG" --json name,body > dist/release.json
          ls -l dist

      - name: Create the GitLab release with the APK
        run: |
          set -euo pipefail
          pid=$(jq -rn --arg p "$GITLAB_PROJECT" '$p|@uri')
          if curl -sf -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "$API/projects/$pid/releases/$(jq -rn --arg t "$TAG" '$t|@uri')" >/dev/null; then
            echo "GitLab release $TAG already exists - nothing to do"; exit 0
          fi
          apk=$(ls dist/*.apk | head -1); name=$(basename "$apk")
          # Upload the APK to the GitLab project; Obtainium finds it through the release asset link.
          up=$(curl -sf -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -F "file=@$apk" "$API/projects/$pid/uploads")
          url="https://gitlab.com$(echo "$up" | jq -r .full_path)"
          echo "uploaded: $url"
          jq -n --arg tag "$TAG" --arg url "$url" --arg file "$name" \
                --slurpfile gh dist/release.json \
            '{tag_name: $tag, name: $gh[0].name,
              description: ($gh[0].body + "\n\n---\nMirrored from GitHub. APK: [" + $file + "](" + $url + ")"),
              assets: {links: [{name: $file, url: $url, link_type: "package",
                                direct_asset_path: ("/" + $file)}]}}' > dist/gitlab-release.json
          curl -sf -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" \
               --data @dist/gitlab-release.json "$API/projects/$pid/releases" | jq '{tag_name, _links}'
