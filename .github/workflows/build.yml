name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Open-source-only build: OpenJDK + R8/D8 + our own resource compiler. No Android SDK.
  oss-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Fetch R8 and apksig (pinned + checksummed, Google Maven, FLOSS licensed)
        run: |
          mkdir -p tools
          curl -sSfL -o tools/r8.jar https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.13.25/r8-8.13.25.jar
          curl -sSfL -o tools/apksig.jar https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/9.5.2/apksig-9.5.2.jar
          echo "0d4f2f68c4fcbc9434eff122f41feb6fb1d98efd2faa530cec1abacab1cea03d  tools/r8.jar" | sha256sum -c
          echo "7ae2e5980c77d853e3513074ee7c822bbdcdcde1668889d17faa7fe8bc8aa821  tools/apksig.jar" | sha256sum -c
      - name: Compile stubs + app
        run: |
          mkdir -p out/stubs out/classes out/test out/dex out/bt out/apk
          javac --release 8 -nowarn -Xlint:-options -d out/stubs $(find stubs -name '*.java')
          javac --release 8 -nowarn -Xlint:-options -cp out/stubs -d out/classes $(find app -name '*.java')
      - name: Tests (link cleaner + photo metadata stripper)
        run: |
          javac -nowarn -cp out/classes -d out/test buildtools/LinkCleanerTest.java buildtools/StripperTest.java
          java -cp out/classes:out/test LinkCleanerTest
      - name: Stubs match AOSP's public API
        run: |
          curl -sSfL "https://android.googlesource.com/platform/frameworks/base/+/refs/heads/main/core/api/current.txt?format=TEXT" | base64 -d > out/api.txt
          curl -sSfL "https://android.googlesource.com/platform/packages/modules/Permission/+/refs/heads/main/framework-s/api/current.txt?format=TEXT" | base64 -d >> out/api.txt
          API_FILE=out/api.txt STUB_DIR=out/stubs JAVAP=javap python3 buildtools/verify_stubs.py
      - name: Generated text manifest/icon are up to date
        run: |
          javac -nowarn -d out/bt buildtools/ResEncoder.java
          java -cp out/bt ResEncoder --text android/AndroidManifest.xml res/drawable-anydpi-v26/ic_launcher.xml res/xml/accessibility_service.xml res/values/strings.xml
          git diff --exit-code -- android/AndroidManifest.xml res/drawable-anydpi-v26/ic_launcher.xml res/xml/accessibility_service.xml res/values/strings.xml
          grep -q "versionCode $(grep -o 'VERSION_CODE = [0-9]*' buildtools/ResEncoder.java | grep -o '[0-9]*')" android/build.gradle
      - name: Dex + resources + unsigned APK
        run: |
          java -cp tools/r8.jar com.android.tools.r8.D8 --release --min-api 29 --lib "$JAVA_HOME" \
            --classpath out/stubs --output out/dex $(find out/classes -name '*.class')
          cp -R res out/apk/res && rm -r out/apk/res/values out/apk/res/drawable-anydpi-v26/ic_launcher.xml out/apk/res/xml/accessibility_service.xml
          java -cp out/bt ResEncoder out/apk
          cp out/dex/classes.dex out/apk/
          (cd out/apk && zip -q -X -9 ../unsigned-oss.apk AndroidManifest.xml classes.dex res/drawable-anydpi-v26/ic_launcher.xml res/xml/accessibility_service.xml \
            && zip -q -X -0 ../unsigned-oss.apk resources.arsc $(find res -name '*.png' | sort))
      - uses: actions/upload-artifact@v4
        with: { name: unsigned-oss-apk, path: out/unsigned-oss.apk }

  # Standard Gradle build, the way F-Droid builds it.
  gradle-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches anything missing.
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.9.2' }
      - run: gradle --no-daemon :android:assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: unsigned-gradle-apk, path: android/build/outputs/apk/release/*.apk }
